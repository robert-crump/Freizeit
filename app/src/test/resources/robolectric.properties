# Use a plain Application instead of FreizeitApplication for Robolectric unit tests.
# FreizeitApplication.onCreate() calls MapLibre.getInstance(), which loads a native
# library that isn't available in the JVM test environment and crashes every test
# that touches ApplicationProvider.getApplicationContext() (UnsatisfiedLinkError).
# These tests only need a Context to hand to Room, not the app's real init/DI.
application=android.app.Application
